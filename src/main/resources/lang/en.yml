# Denial messages. $1 is the item/content/entity; $3 is the interaction target.
message-format: '&f[&2Modifyworld&f]&4 %s'
default-message: 'You are not allowed to do that.'
modifyworld.items.use: 'You may not use &a$1&4 on &a$3&4.'
