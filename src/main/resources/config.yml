# Managed configuration version; migrations use fixed release thresholds.
config-version: '${project.version}'
# Modern material names only; legacy numeric IDs and metadata require migration.
# Enable item-on-block/entity permission checks, including flint and steel.
item-use-check: true
inform-players: true
item-restrictions: false
drop-restricted-item: false
# Require modifyworld.login in addition to Minecraft's own admission checks.
# This does not enable or disable Minecraft's whitelist.
# Legacy alias: whitelist. An explicitly set require-login-permission takes precedence.
require-login-permission: false

# Allow operators to bypass Modifyworld checks, including explicit denials.
# With false, OPs need an effective permission assignment; OP fallback alone is ignored.
op-bypass: false
# Server message language: en, de, es, fr, pt_br, pl, tr or own. Restart after changing.
language: en
# Legacy message overrides are migrated to lang/own.yml with a config backup.
messages: {}
